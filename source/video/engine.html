<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,x=document.getElementById('c').getContext('2d');x.direction='rtl';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function win(t,a,b,fi=.7,fo=.7){if(t<a||t>b)return 0;return Math.min(clamp((t-a)/fi),clamp((b-t)/fo));}
function rng(s){return()=>{s=(s*16807)%2147483647;return s/2147483647;}}
const R=rng(7);
const stars=[...Array(140)].map(()=>({x:R()*W,y:R()*H,r:R()*1.8+.3,p:R()*6.28,s:R()*.6+.2}));
const motes=[...Array(70)].map(()=>({x:R()*W,y:R()*H,r:R()*3+1,v:R()*40+15,p:R()*6.28}));
const AR=n=>Math.round(n).toLocaleString('ar-EG');
function txt(s,y,size,{font='Tajawal',w=500,col='255,255,255',a=1,glow=0,maxW=960}={}){
  if(a<=0)return;x.save();x.font=`${w} ${size}px ${font}`;x.textAlign='center';x.textBaseline='middle';
  const m=x.measureText(s).width;if(m>maxW){x.font=`${w} ${size*maxW/m}px ${font}`;}
  if(glow){x.shadowColor=`rgba(${col},${a*.8})`;x.shadowBlur=glow;}
  x.fillStyle=`rgba(${col},${a})`;x.fillText(s,W/2,y);x.restore();}
// gradient sky: from [top,bottom] palette A to palette B as d goes 0..1
function sky(A,B,d){const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${A[0].map((v,i)=>lerp(v,B[0][i],d))})`);g.addColorStop(1,`rgb(${A[1].map((v,i)=>lerp(v,B[1][i],d))})`);
  x.fillStyle=g;x.fillRect(0,0,W,H);}
function starfield(t,a){for(const s of stars){const tw=.5+.5*Math.sin(t*s.s*3+s.p);
  x.fillStyle=`rgba(200,215,255,${a*tw*.7})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();}}
function bloom(cx,cy,r,col,a){if(a<=0)return;const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(0,0,W,H);}
function rising(t,t0,a,col='255,215,150'){if(a<=0)return;for(const m of motes){const yy=((m.y-(t-t0)*m.v)%H+H)%H;
  x.fillStyle=`rgba(${col},${a*(.4+.4*Math.sin(t*2+m.p))})`;x.beginPath();x.arc(m.x+Math.sin(t+m.p)*20,yy,m.r,0,6.28);x.fill();}}
function reveal(t,t0,t1,name,col='255,214,130'){const a=win(t,t0,t1,1.1,.9),p=1+.025*Math.sin((t-t0)*3);
  if(a<=0)return;x.save();x.translate(W/2,H*.47);x.scale(p,p);x.translate(-W/2,-H*.47);
  txt(name,H*.47,220,{font:'Amiri',w:700,a,glow:col.startsWith('92')?0:60,col});x.restore();}
function fadeEdges(t,D){const g=Math.min(clamp(t/.6),clamp((D-t)/.6));if(g<1){x.fillStyle=`rgba(0,0,0,${1-g})`;x.fillRect(0,0,W,H);}}

function mk(c){return{D:44,frame(t){
  const d=ease(clamp((t-35)/4));sky(c.sky[0],c.sky[1],d);starfield(t,(1-d)*.5*clamp(t/2));
  c.sym(t,Math.min(clamp((t-.3)/1.2),1)*(1-.75*ease(clamp((t-33)/1.5)))*(1-.7*win(t,29,34,.8,.8)));
  if(t>=29.4&&t<=34.4)x.fillStyle='rgba(0,0,0,0)';
  for(const L of c.lines){txt(L[2],H*L[3],L[4],{a:win(t,L[0],L[1],.7,.6),w:L[5]||500,font:L[6]||'Tajawal',col:'255,245,230',glow:L[6]?12:0});}
  const n=c.ayah.length;c.ayah.forEach((s,i)=>txt(s,H*(.66+i*.07),n>1?66:90,{font:'AmiriQ',a:win(t,29.4+i*.5,34,1,.8),glow:18,col:'255,236,200'}));
  txt(c.ref,H*(.66+n*.07+.005),34,{a:win(t,30.4,34,1,.8),w:300,col:'200,200,215'});
  reveal(t,34,37.6,c.name);rising(t,33,win(t,33.8,44,1.5,1)*.8);
  txt(c.todo[0],H*.38,58,{a:win(t,37.8,44,.8,.6),col:'255,245,230'});
  txt(c.todo[1],H*.46,c.todo[1].length>30?50:70,{font:'Amiri',w:700,a:win(t,38.6,44,1,.6),glow:14,maxW:960});
  txt(c.src,H*.54,34,{a:win(t,39.8,44,1,.6),w:300,col:'255,235,210'});
  txt('#تجليات_الأسماء',H*.86,40,{a:win(t,41.2,44,.8,.5),col:'255,240,220'});
  fadeEdges(t,44);}}}

const NIGHT=[[4,6,18],[8,12,30]],DAWN=[[40,28,60],[214,140,90]];
const SCENES={
 // ── الرحمن: التنفس أثناء النوم ────────────────────────────
 rahman:{D:44,frame(t){
  const d=ease(clamp((t-36.5)/4));sky(NIGHT,DAWN,d);
  bloom(W/2,H*.5,900,'255,200,110',win(t,33.6,38.5,1.2,2)*.25+d*.16);starfield(t,(1-d)*clamp(t/2));
  txt('قبل ساعات…',H*.46,74,{a:win(t,.6,4.1,.9,.6),w:300,col:'210,220,240'});
  txt('كنتَ غائباً تماماً',H*.44,96,{a:win(t,4.3,8.6,.6,.6),w:800});
  txt('لا تسمع.  لا ترى.  لا تعرف أين أنت.',H*.52,46,{a:win(t,5.4,8.6,.8,.6),w:300,col:'170,185,215'});
  const ba=win(t,8.5,14.2,.8,.7);if(ba>0){const ph=Math.sin(2*Math.PI*t/4.5-Math.PI/2)*.5+.5,r=170+ph*110;
    for(let i=5;i>=1;i--){x.beginPath();x.arc(W/2,H*.40,r+i*26,0,6.28);x.strokeStyle=`rgba(120,180,255,${ba*.07*(6-i)})`;x.lineWidth=2;x.stroke();}
    const g=x.createRadialGradient(W/2,H*.40,0,W/2,H*.40,r);g.addColorStop(0,`rgba(140,195,255,${ba*.35})`);g.addColorStop(1,`rgba(60,110,220,${ba*.04})`);
    x.fillStyle=g;x.beginPath();x.arc(W/2,H*.40,r,0,6.28);x.fill();}
  txt('ومع ذلك… تنفّستَ',H*.64,62,{a:win(t,8.8,14.2,.6,.6)});
  txt(AR(ease(clamp((t-10)/2.6))*7000),H*.72,132,{a:win(t,9.9,14.2,.4,.6),w:800,col:'150,200,255',glow:30});
  txt('نَفَساً تقريباً',H*.79,44,{a:win(t,10.4,14.2,.6,.6),w:300,col:'170,185,215'});
  const ea=win(t,14.2,19.8,.8,.8);if(ea>0){x.save();x.lineWidth=5;x.shadowColor=`rgba(255,90,110,${ea})`;x.shadowBlur=25;x.beginPath();
    for(let px=-100;px<=W+100;px+=4){const f=((t-(W-px)/420)%1+1)%1;let v=0;
      if(f>.10&&f<.14)v=-30*Math.sin((f-.10)/.04*Math.PI);else if(f>.18&&f<.21)v=40*((f-.18)/.03);
      else if(f>=.21&&f<.25)v=lerp(40,-190,(f-.21)/.04);else if(f>=.25&&f<.29)v=lerp(-190,60,(f-.25)/.04);
      else if(f>=.29&&f<.32)v=lerp(60,0,(f-.29)/.03);else if(f>.45&&f<.58)v=-45*Math.sin((f-.45)/.13*Math.PI);
      px===-100?x.moveTo(px,H*.4+v):x.lineTo(px,H*.4+v);}
    const lg=x.createLinearGradient(0,0,W,0);lg.addColorStop(0,'rgba(255,90,110,0)');lg.addColorStop(.6,`rgba(255,110,125,${ea*.6})`);lg.addColorStop(.92,`rgba(255,200,205,${ea})`);lg.addColorStop(1,'rgba(255,200,205,0)');
    x.strokeStyle=lg;x.stroke();x.restore();}
  txt('ونبض قلبك',H*.58,62,{a:win(t,14.6,19.8,.6,.6)});
  txt(AR(ease(clamp((t-15.5)/2.8))*28800),H*.67,132,{a:win(t,15.4,19.8,.4,.6),w:800,col:'255,140,150',glow:30});
  txt('نبضة تقريباً',H*.74,44,{a:win(t,15.9,19.8,.6,.6),w:300,col:'215,180,190'});
  txt('ولم تأمر أحداً منهما',H*.45,80,{a:win(t,20,23.4,.6,.5),w:800});
  txt('بشيء.',H*.52,80,{a:win(t,21,23.4,.5,.5),w:800});
  txt('فمن كان',H*.43,72,{a:win(t,24,28.2,.9,.7),w:300,col:'215,225,245'});
  txt('يُمسِك عليك أنفاسك؟',H*.50,92,{a:win(t,24.8,28.2,.9,.7),w:800});
  const bw=win(t,28.2,34,1,.8);for(let i=0;i<9;i++){const b=birds[i],px=((b.x-(t-28)*b.v)%(W+200)+W+200)%(W+200)-100,f=Math.sin(t*5*b.s+b.p)*.5+.5;
    x.save();x.translate(px,b.y+Math.sin(t*.8+b.p)*14);x.scale(b.s,b.s);x.strokeStyle=`rgba(230,235,255,${bw*.8})`;x.lineWidth=3.2/b.s;x.lineCap='round';
    x.beginPath();x.moveTo(-34,-14*f);x.quadraticCurveTo(-14,-6-4*f,0,4);x.quadraticCurveTo(14,-6-4*f,34,-14*f);x.stroke();x.restore();}
  txt('مَا يُمۡسِكُهُنَّ إِلَّا ٱلرَّحۡمَٰنُۚ',H*.66,86,{font:'AmiriQ',w:400,a:win(t,29.4,34,1,.8),glow:18,col:'255,236,200'});
  txt('[ الملك: ١٩ ]',H*.735,34,{a:win(t,30.2,34,1,.8),w:300,col:'170,180,205'});
  reveal(t,34,37.6,'الرَّحۡمَٰن');rising(t,33,win(t,33.8,44,1.5,1)*.8);
  txt('فإذا استيقظتَ غداً… قل:',H*.36,58,{a:win(t,37.8,44,.8,.6),col:'255,245,230'});
  txt('الحَمْدُ للهِ الَّذِي أَحْيَانَا',H*.46,82,{font:'Amiri',w:700,a:win(t,38.8,44,1,.6),glow:14});
  txt('بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',H*.53,82,{font:'Amiri',w:700,a:win(t,39.4,44,1,.6),glow:14});
  txt('رواه البخاري',H*.60,34,{a:win(t,40,44,1,.6),w:300,col:'255,235,210'});
  txt('#تجليات_الأسماء',H*.86,40,{a:win(t,41.2,44,.8,.5),col:'255,240,220'});
  fadeEdges(t,44);}},

 // ── التواب: الباب الذي لا يُغلق ──────────────────────────
 tawwab:{D:44,frame(t){
  const d=ease(clamp((t-30)/5));sky([[10,8,20],[22,16,34]],[[30,22,40],[120,80,60]],d);starfield(t,(1-d)*.5*clamp(t/2));
  // the door: a vertical slit of light that narrows, then opens wide
  const open=t<12?lerp(.55,.12,ease(clamp((t-3)/8))):t<30?.12:lerp(.12,1,ease(clamp((t-30)/4.5)));
  const da=Math.min(clamp((t-.3)/1.2),1)*(1-.72*ease(clamp((t-35.6)/1.2)));const dw=60+open*520,dh=900,dx=W/2-dw/2,dy=H*.18;
  if(da>0){x.save();const g=x.createLinearGradient(dx,0,dx+dw,0);g.addColorStop(0,`rgba(255,196,120,${da*.55})`);g.addColorStop(.5,`rgba(255,236,190,${da*.95})`);g.addColorStop(1,`rgba(255,196,120,${da*.55})`);
    x.shadowColor=`rgba(255,200,120,${da})`;x.shadowBlur=80+open*120;x.fillStyle=g;x.fillRect(dx,dy,dw,dh);x.restore();
    // spill of light on the floor
    const fl=x.createLinearGradient(0,dy+dh,0,dy+dh+520);fl.addColorStop(0,`rgba(255,210,140,${da*(.18+open*.3)})`);fl.addColorStop(1,'rgba(255,210,140,0)');
    x.fillStyle=fl;x.beginPath();x.moveTo(dx,dy+dh);x.lineTo(dx+dw,dy+dh);x.lineTo(W/2+dw*1.6,dy+dh+520);x.lineTo(W/2-dw*1.6,dy+dh+520);x.fill();}
  // the text sits on a dark band below the door
  txt('كم مرة قلتَ:',H*.80,56,{a:win(t,.8,4.6,.7,.6),w:300,col:'225,215,235'});
  txt('«هذه آخر مرة»؟',H*.86,84,{a:win(t,1.6,4.6,.7,.6),w:800});
  txt('ثم عدت…',H*.83,80,{a:win(t,5,8,.6,.6),w:800});
  txt('وظننتَ أن الباب أُغلق.',H*.83,74,{a:win(t,8.4,12.2,.7,.6),w:800});
  txt('لكنّ اللهَ يبسطُ يدَه بالليل',H*.78,56,{a:win(t,12.8,19.4,.8,.7),col:'255,240,220'});

  txt('ويبسطُ يدَه بالنهار',H*.86,56,{a:win(t,14.4,19.4,.8,.7),col:'255,240,220'});
  txt('ليتوبَ مسيءُ الليل',H*.90,56,{a:win(t,15.2,19.4,.8,.7),col:'255,240,220'});
  txt('رواه مسلم',H*.945,32,{a:win(t,16,19.4,.8,.7),w:300,col:'210,190,170'});
  txt('بل إن رغبتك في الرجوع الآن…',H*.82,58,{a:win(t,20,25,.7,.6)});
  txt('هو الذي وضعها في قلبك.',H*.87,68,{a:win(t,21.4,25,.7,.6),w:800});
  txt('ثُمَّ تَابَ عَلَيۡهِمۡ لِيَتُوبُوٓاْۚ',H*.82,84,{font:'AmiriQ',a:win(t,25.6,30.2,1,.7),glow:16,col:'255,236,200'});
  txt('[ التوبة: ١١٨ ]',H*.88,34,{a:win(t,26.4,30.2,1,.7),w:300,col:'200,185,170'});

  txt('رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ',H*.44,80,{font:'Amiri',w:700,a:win(t,37.2,44,1,.6),glow:14});
  txt('إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ',H*.51,80,{font:'Amiri',w:700,a:win(t,37.8,44,1,.6),glow:14});
  txt('كان النبي ﷺ يقولها في المجلس مئة مرة · رواه أبو داود والترمذي',H*.58,32,{a:win(t,38.4,44,1,.6),w:300,col:'255,235,210'});
  txt('#تجليات_الأسماء',H*.88,40,{a:win(t,40.5,44,.8,.5),col:'255,240,220'});
  fadeEdges(t,44);}},

 // ── الشكور: غصن الشوك ───────────────────────────────────
 shakur:{D:44,frame(t){
  const d=ease(clamp((t-27)/6));sky([[14,20,18],[30,44,38]],[[40,46,30],[190,150,80]],d);
  // a path drawn in perspective, from bottom to horizon
  const pa=clamp((t-.3)/1.5)*(1-win(t,33,37.5,1,1)*.6);
  if(pa>0){x.save();const hy=H*.36;x.fillStyle=`rgba(220,200,160,${pa*.16})`;x.beginPath();x.moveTo(W/2-20,hy);x.lineTo(W/2+20,hy);x.lineTo(W*.95,H);x.lineTo(W*.05,H);x.fill();
    x.strokeStyle=`rgba(235,220,185,${pa*.45})`;x.lineWidth=3;x.beginPath();x.moveTo(W/2-20,hy);x.lineTo(W*.05,H);x.moveTo(W/2+20,hy);x.lineTo(W*.95,H);x.stroke();
    // walking dashes moving toward viewer
    for(let i=0;i<14;i++){const z=((i/14+t*.12)%1),yy=lerp(hy,H,z*z),ww=lerp(2,26,z*z);x.fillStyle=`rgba(240,228,200,${pa*.35*z})`;x.fillRect(W/2-ww/2,yy,ww,lerp(4,40,z*z));}

  const mv=ease(clamp((t-10.6)/1.6)),ba=win(t,5.4,26,.8,1)*pa;
  if(ba>0){x.save();x.translate(lerp(W/2,W*.9,mv),lerp(H*.62,H*.66,mv));x.rotate(lerp(-.08,-1.2,mv));x.strokeStyle=`rgba(120,150,110,${ba})`;x.lineWidth=12;x.lineCap='round';
    x.beginPath();x.moveTo(-300,0);x.quadraticCurveTo(0,-30,300,10);x.stroke();x.lineWidth=5;
    for(let i=-260;i<=260;i+=46){const s=i%92===0?-1:1;x.beginPath();x.moveTo(i,-6);x.lineTo(i+14,-6+s*34);x.stroke();}
    x.restore();}
  txt('رجلٌ يمشي في طريق…',H*.20,70,{a:win(t,.8,5.2,.8,.6),w:800});

  txt('«فشكرَ اللهُ له، فغفرَ له»',H*.20,74,{font:'Amiri',w:700,a:win(t,19,24.2,.8,.7),glow:16,col:'255,236,200'});
  txt('رواه البخاري ومسلم',H*.255,34,{a:win(t,19.8,24.2,.8,.7),w:300,col:'210,215,195'});
  txt('كم غصناً أزحتَه',H*.17,72,{a:win(t,24.6,29,.8,.6),w:300,col:'235,235,220'});
  txt('ولم يره أحد؟',H*.23,86,{a:win(t,25.4,29,.8,.6),w:800});
  txt('إِنَّهُۥ غَفُورࣱ شَكُورࣱ',H*.20,96,{font:'AmiriQ',a:win(t,29.4,33.4,1,.7),glow:18,col:'255,236,200'});
  txt('[ فاطر: ٣٠ ]',H*.265,34,{a:win(t,30.2,33.4,1,.7),w:300,col:'215,210,190'});
  bloom(W/2,H*.47,900,'255,205,120',win(t,33.4,38,1.2,1.6)*.3);
  reveal(t,33.6,37.6,'الشَّكُور');rising(t,33,win(t,33.4,44,1.5,1)*.7);

 // ── مشاهد جديدة بقالب موحّد ──
