<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Kufi;src:url(../../vendor/node_modules/@fontsource/reem-kufi/files/reem-kufi-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:Kufi;src:url(../../vendor/node_modules/@fontsource/reem-kufi/files/reem-kufi-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:Naskh;src:url(../../vendor/node_modules/@fontsource/noto-naskh-arabic/files/noto-naskh-arabic-arabic-600-normal.woff2);font-weight:600}
@font-face{font-family:Naskh;src:url(../../vendor/node_modules/@fontsource/noto-naskh-arabic/files/noto-naskh-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:Plex;src:url(../../vendor/node_modules/@fontsource/ibm-plex-sans-arabic/files/ibm-plex-sans-arabic-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:Quran;src:url(../../vendor/node_modules/@fontsource/amiri-quran/files/amiri-quran-arabic-400-normal.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:var(--h);overflow:hidden}
.c{width:1080px;height:var(--h);position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:120px 110px;gap:40px}
.night{background:#0E1324;color:#E9E6DD}.paper{background:#F1F2F5;color:#1B2338}
.night .g{color:#E3B45C}.paper .g{color:#A8761E}
.frame{position:absolute;inset:44px;border:2px solid currentColor;opacity:.16;border-radius:6px;pointer-events:none}
.star{width:64px;height:64px}
.kicker{font:500 34px/1.4 Plex;letter-spacing:.02em}
.q{font:700 88px/1.45 Kufi;text-wrap:balance}
.num{font:700 120px/1 Kufi;opacity:.9}
.tj{font:700 76px/1.6 Naskh;text-wrap:balance}
.name{font:700 150px/1.15 Kufi}
.ayah{font:400 var(--af,58px)/2 Quran;text-wrap:balance}
.ref{font:500 30px/1.4 Plex;opacity:.7}
.act{font:600 44px/1.7 Naskh;text-wrap:balance;max-width:840px}
.foot{position:absolute;bottom:86px;left:0;right:0;font:500 30px Plex;opacity:.6}
.dots{position:absolute;top:86px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;background:currentColor;opacity:.2}.dots i.on{opacity:.9}
.rule{width:120px;height:3px;background:currentColor;opacity:.5}
.wall{padding-top:420px}.wall .name{font-size:230px}.wall .line{font:700 82px/1.6 Naskh;text-wrap:balance;max-width:820px}
</style></head><body>
<script src="../../dist/data.js"></script><script src="products.js"></script>
<script>
const q=new URLSearchParams(location.search),id=q.get('n'),s=q.get('s');
const A=window.ASMA.find(x=>x.id===id),P=window.PROD[id];
const star='<svg class="star g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2l2.4 4.2L19 5l-1.2 4.6L22 12l-4.2 2.4L19 19l-4.6-1.2L12 22l-2.4-4.2L5 19l1.2-4.6L2 12l4.2-2.4L5 5l4.6 1.2z"/><circle cx="12" cy="12" r="3"/></svg>';
const dots=k=>'<div class="dots">'+[0,1,2,3,4].map(i=>`<i class="${i==k?'on':''}"></i>`).join('')+'</div>';
const foot='<div class="foot">#تجليات_الأسماء</div>';
const ar=n=>n.toLocaleString('ar-EG');
let h=1350,cls,html;
const tj=A.groups[P.carousel.group].tajalliyat;
if(s==='0'){cls='night';html=`${dots(0)}${star}<p class="kicker g">من تجليات اسم ${A.plain}</p><h1 class="q">${P.carousel.cover}</h1>${foot}`}
else if(['1','2','3'].includes(s)){const k=+s;cls='paper';html=`${dots(k)}<div class="num g">${ar(k)}</div><div class="rule g"></div><p class="tj">${tj[P.carousel.pick[k-1]]}</p><p class="kicker g">هذا تجلٍّ من تجليات اسم ${A.plain}</p>${foot}`}
else if(s==='4'){cls='night';const t=A.ayah.text,af=t.length>90?44:t.length>55?52:62;
 html=`${dots(4)}<h1 class="name g">${A.name}</h1><p class="ayah" style="--af:${af}px">﴿${t}﴾</p><p class="ref">سورة ${A.ayah.surah}، الآية ${ar(+A.ayah.num)}</p><div class="rule g"></div><p class="act">${P.carousel.action}</p>${foot}`}
else {h=1920;cls='night wall';html=`${star}<h1 class="name g">${A.name}</h1><div class="rule g"></div><p class="line">${P.wallpaper}</p>${foot}`}
document.documentElement.style.setProperty('--h',h+'px');
document.body.innerHTML=`<div class="c ${cls}"><div class="frame"></div>${html}</div>`;
</script></body></html>
